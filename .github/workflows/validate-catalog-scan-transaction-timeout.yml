name: Validate catalog scan timeout fix

on:
  push:
    branches:
      - validation/catalog-scan-transaction-timeout

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Lint integration actions
        run: npx eslint src/app/dashboard/integrations/actions.ts
      - name: Production build
        run: npm run build
