name: Validate flexible Product SKU linking

on:
  push:
    branches:
      - validation/flexible-product-sku-linking

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Lint changed files
        run: >
          npx eslint
          src/lib/product-sku-match.ts
          src/lib/inventory.ts
          src/lib/integration-order-import.ts
      - name: Production build
        run: npm run build
