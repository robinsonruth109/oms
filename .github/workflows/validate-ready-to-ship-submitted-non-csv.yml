name: Validate Ready to Ship submitted state

on:
  push:
    branches:
      - validation/ready-to-ship-submitted-non-csv

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Lint changed files
        run: >
          npx eslint
          src/app/dashboard/ready-to-ship/page.tsx
          src/app/dashboard/ready-to-ship/actions.ts
          src/app/api/webhooks/pathao/[courierId]/route.ts
      - name: Production build
        run: npm run build
