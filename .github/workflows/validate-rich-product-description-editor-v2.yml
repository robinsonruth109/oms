name: Validate rich product description editor v2

on:
  push:
    branches:
      - validation/rich-product-description-editor-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Lint rich product editor
        run: npx eslint src/app/dashboard/products/product-catalog-editor.tsx
      - name: Production build
        run: npm run build
