name: Validate searchable taxonomy picker

on:
  push:
    branches:
      - validation/search-taxonomy-picker

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Lint product catalog editor
        run: npx eslint src/app/dashboard/products/product-catalog-editor.tsx
      - name: Production build
        run: npm run build
