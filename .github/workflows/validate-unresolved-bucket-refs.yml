name: Validate unresolved bucket refs

on:
  push:
    branches:
      - validation/reject-unresolved-media-bucket-vars

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Lint storage helper
        run: npx eslint src/lib/product-media-storage.ts
      - name: Production build
        run: npm run build
